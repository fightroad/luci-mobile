name: Build TrollStore IPA

on:
  workflow_dispatch:

env:
  TEAM_ID: X2662V5DT2

jobs:
  build-trollstore-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          # AppDelegate uses FlutterImplicitEngineDelegate (UIScene), requires Flutter >= 3.38
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Disable Code Signing
        run: |
          {
            echo "CODE_SIGNING_ALLOWED=NO"
            echo "CODE_SIGNING_REQUIRED=NO"
            echo "CODE_SIGN_IDENTITY="
            echo "EXPANDED_CODE_SIGN_IDENTITY="
            echo "CODE_SIGN_STYLE=Manual"
          } >> ios/Flutter/Release.xcconfig

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Ad-hoc sign for TrollStore
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          APP_ID="${TEAM_ID}.${BUNDLE_ID}"
          ENTITLEMENTS="${RUNNER_TEMP}/Runner.signing.entitlements"

          # Identity entitlements only (EasyTier-style ad-hoc). No special capabilities.
          plutil -create xml1 "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy \
            -c "Add :application-identifier string ${APP_ID}" \
            -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" \
            "$ENTITLEMENTS"

          if [[ -d "$APP_PATH/Frameworks" ]]; then
            find "$APP_PATH/Frameworks" -name '*.framework' -maxdepth 1 | while read -r fw; do
              codesign --force --sign - --timestamp=none --generate-entitlement-der "$fw"
            done
            find "$APP_PATH/Frameworks" -name '*.dylib' -maxdepth 1 | while read -r lib; do
              codesign --force --sign - --timestamp=none --generate-entitlement-der "$lib"
            done
          fi

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2)
          IPA_NAME="LuCI-Mobile-${VERSION}-${BUILD}-TrollStore.ipa"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload

          ls -lh "$IPA_NAME"
          echo "ipa_path=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuCI-Mobile-TrollStore-IPA
          path: ${{ steps.package.outputs.ipa_path }}
          retention-days: 30
