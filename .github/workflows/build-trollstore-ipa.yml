name: Build TrollStore IPA

on:
  workflow_dispatch:

env:
  TEAM_ID: X2662V5DT2

jobs:
  build-trollstore-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          # AppDelegate uses FlutterImplicitEngineDelegate (UIScene), requires Flutter >= 3.38
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Disable Code Signing
        run: |
          {
            echo "CODE_SIGNING_ALLOWED=NO"
            echo "CODE_SIGNING_REQUIRED=NO"
            echo "CODE_SIGN_IDENTITY="
            echo "EXPANDED_CODE_SIGN_IDENTITY="
            echo "CODE_SIGN_STYLE=Manual"
          } >> ios/Flutter/Release.xcconfig

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Install ldid
        run: brew install ldid

      - name: Package TrollStore IPA
        id: package
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          MAIN_BIN="$APP_PATH/$EXEC_NAME"
          APP_ID="${TEAM_ID}.${BUNDLE_ID}"
          ENTITLEMENTS="${RUNNER_TEMP}/TrollStore.entitlements"
          test -f "$MAIN_BIN"

          plutil -create xml1 "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy \
            -c "Add :application-identifier string ${APP_ID}" \
            -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" \
            -c "Add :get-task-allow bool false" \
            -c "Add :com.apple.developer.networking.multicast bool true" \
            -c "Add :keychain-access-groups array" \
            -c "Add :keychain-access-groups:0 string ${APP_ID}" \
            "$ENTITLEMENTS"

          while IFS= read -r -d '' file; do
            if [[ "$file" == "$MAIN_BIN" ]]; then
              continue
            fi
            if file "$file" | grep -q 'Mach-O'; then
              ldid -S "$file" || true
            fi
          done < <(find "$APP_PATH" -type f -print0)

          ldid "-S${ENTITLEMENTS}" "$MAIN_BIN"
          test -f "$APP_PATH/Info.plist"

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2)
          IPA_NAME="LuCI-Mobile-${VERSION}-${BUILD}-TrollStore.ipa"

          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/Runner.app"
          test -f "Payload/Runner.app/Info.plist"

          zip -qry "$IPA_NAME" Payload
          rm -rf Payload

          unzip -l "$IPA_NAME" | grep -q 'Payload/Runner.app/Info.plist'
          unzip -qo "$IPA_NAME" "Payload/Runner.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Runner.app/Info.plist
          rm -rf Payload

          ls -lh "$IPA_NAME"
          echo "ipa_path=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuCI-Mobile-TrollStore-IPA
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30
